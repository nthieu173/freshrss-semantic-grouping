name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
        env:
          update: true
      - name: Extension checks
        run: make test/php
      - name: FreshRSS 1.30.0 API compatibility
        run: make test/compatibility

  worker:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - run: python -m pip install uv==0.12.10
      - name: Worker checks
        run: make test/worker

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: FreshRSS 1.30.0 and worker integration
        run: make test/integration

  arm64-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/Containerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: freshrss-semantic-grouping:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test under the memory and filesystem contract
        run: make test/smoke
