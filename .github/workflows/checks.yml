name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
        env:
          update: true
      - name: PHP syntax
        run: find extension -type f \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l
      - name: Extension contract tests
        run: php extension/tests/run.php
      - name: FreshRSS 1.29.1 API compatibility
        run: |
          git clone --depth 1 --branch 1.29.1 https://github.com/FreshRSS/FreshRSS.git /tmp/FreshRSS
          cp -a extension/xExtension-SemanticGrouping /tmp/FreshRSS/extensions/
          php -l /tmp/FreshRSS/extensions/xExtension-SemanticGrouping/extension.php

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --project worker --locked --extra dev
      - run: uv run --project worker pytest
      - run: uv run --project worker ruff check worker/src worker/tests
      - run: uv run --project worker mypy worker/src
      - name: sqlite-vec is not installed
        run: '! uv run --project worker python -c "import sqlite_vec"'

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: FreshRSS 1.29.1 and worker integration
        run: ./tests/integration/run.sh

  arm64-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/Containerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: freshrss-semantic-grouping:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test under the memory and filesystem contract
        run: |
          mkdir .ci-semantic
          chmod 0777 .ci-semantic
          python3 - <<'PY'
          import json, sqlite3, time
          db = sqlite3.connect('.ci-semantic/semantic.sqlite')
          db.executescript(open('fixtures/semantic-schema-v1.sql').read())
          now = int(time.time())
          config = {
              'enabled': True, 'embedding_model': 'minishlab/potion-base-8M',
              'similarity_threshold': .25, 'window_hours': 72,
              'minimum_group_size': 2,
              'include_title': True, 'include_content': False,
              'content_character_limit': 2000, 'embedding_batch_size': 128,
              'normalization_version': 1, 'query_fingerprint': 'smoke',
              'force_rebuild_token': ''}
          db.execute('INSERT INTO candidate_generations VALUES (1,?,?,?,?)',
                     ('smoke', now, now, 2))
          inputs = [
              ('1000001', '1', now - 2, 'Semantic city council approves climate plan', 'source-1', now),
              ('1000002', '1', now - 1, 'Semantic climate plan approved by city council', 'source-2', now),
          ]
          db.executemany('INSERT INTO article_inputs VALUES (?,?,?,?,?,?)', inputs)
          db.executemany('INSERT INTO candidate_members VALUES (?,?,?)',
                         [(1, row[0], row[4]) for row in inputs])
          db.execute('INSERT INTO pipeline_config VALUES (1,1,?,?,?,?,?)',
                     ('smoke', 1, now + 5400, json.dumps(config), now))
          db.commit()
          db.close()
          PY
          chmod 0666 .ci-semantic/semantic.sqlite
          docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp:rw,size=32m \
            --network none --memory 400m -v "$PWD/.ci-semantic:/semantic-data" \
            freshrss-semantic-grouping:check run
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('.ci-semantic/semantic.sqlite')
          assert db.execute('SELECT COUNT(*) FROM embeddings').fetchone()[0] == 2
          assert db.execute("SELECT value FROM worker_state WHERE key='last_published_generation'").fetchone()[0] == '1'
          db.close()
          PY
