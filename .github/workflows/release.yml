name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  checks:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
        env:
          update: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - run: python -m pip install uv==0.12.10
      - name: Release checks
        env:
          TAG: ${{ github.ref_name }}
        run: make ci/check

  release:
    needs: checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: FreshRSS 1.30.0 and worker integration
        run: make test/integration
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned ARM64 image
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/arm64 --push \
            --build-arg VERSION="${TAG#v}" --build-arg REVISION="$SHA" \
            --build-arg SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$TAG" --tag "$image:$SHA" \
            --metadata-file image-metadata.json -f packaging/Containerfile .
      - name: Build deterministic extension artifact
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: make ci/extension-artifact
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(make --no-print-directory ci/release-notes)"
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes "$notes" \
            "xExtension-SemanticGrouping-$version.tar.gz" \
            "xExtension-SemanticGrouping-$version.tar.gz.sha256"
      - name: Advance stable image tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:stable" "$image:$TAG"
