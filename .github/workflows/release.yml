name: release

on:
  push:
    tags: ['v*']

permissions: {}

# Releases run one at a time and are never cancelled part-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
        env:
          update: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - name: Release checks
        env:
          TAG: ${{ github.ref_name }}
        run: make ci/check

  release:
    name: Release
    needs: checks
    permissions:
      contents: write # gh release create: the release and its artifacts
      packages: write # docker buildx: push the image to ghcr.io
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FreshRSS 1.30.4 and worker integration
        run: make test/integration
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned ARM64 image
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/arm64 --push \
            --build-arg VERSION="${TAG#v}" --build-arg REVISION="$SHA" \
            --build-arg SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$TAG" --tag "$image:$SHA" \
            --metadata-file image-metadata.json -f packaging/Containerfile .
      - name: Build deterministic extension artifact
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: make ci/extension-artifact
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(make --no-print-directory ci/release-notes)"
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes "$notes" \
            "xExtension-SemanticGrouping-$version.tar.gz" \
            "xExtension-SemanticGrouping-$version.tar.gz.sha256"
      - name: Advance stable image tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:stable" "$image:$TAG"
