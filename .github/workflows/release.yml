name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paired release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          expected = os.environ['TAG'].removeprefix('v')
          extension = json.loads(pathlib.Path('extension/xExtension-SemanticGrouping/metadata.json').read_text())['version']
          worker = tomllib.loads(pathlib.Path('worker/pyproject.toml').read_text())['project']['version']
          if extension != expected or worker != expected:
              raise SystemExit(f'tag={expected}, extension={extension}, worker={worker}')
          PY
      - run: python -m pip install uv==0.12.3
      - run: php extension/tests/run.php
      - run: find extension -type f \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l
      - run: uv sync --project worker --locked --extra dev
      - run: uv run --project worker pytest
      - run: uv run --project worker ruff check worker/src worker/tests
      - run: uv run --project worker mypy worker/src
      - name: FreshRSS 1.29.1 and worker integration
        run: ./tests/integration/run.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned ARM64 image
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/arm64 --push \
            --build-arg VERSION="${TAG#v}" --build-arg REVISION="$SHA" \
            --build-arg SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$TAG" --tag "$image:$SHA" \
            --metadata-file image-metadata.json -f packaging/Containerfile .
      - name: Build deterministic extension artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C extension -czf "xExtension-SemanticGrouping-$version.tar.gz" xExtension-SemanticGrouping
          sha256sum "xExtension-SemanticGrouping-$version.tar.gz" > "xExtension-SemanticGrouping-$version.tar.gz.sha256"
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          digest="$(python -c 'import json; print(json.load(open("image-metadata.json"))["containerimage.digest"])')"
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes "Supported FreshRSS: 1.29.1. Semantic database schema: 1. OCI digest: $digest" \
            "xExtension-SemanticGrouping-$version.tar.gz" \
            "xExtension-SemanticGrouping-$version.tar.gz.sha256"
      - name: Advance stable image tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:stable" "$image:$TAG"
