[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "freshrss-semantic-grouping"
version = "0.8.0"
description = "Offline semantic grouping worker for FreshRSS"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0"
dependencies = [
  "model2vec==0.9.0",
  "numpy==2.5.3",
  "semhash==0.4.1",
  "usearch==2.26.2",
  "vicinity==0.4.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[project.scripts]
freshrss-semantic = "freshrss_semantic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freshrss_semantic"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["freshrss_semantic"]
